
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#1a3a52">
    <meta name="description" content="A simple and organized task management app.">

    <title>My To-Do List | AURIX15</title>

    <link rel="manifest" href="./manifest.json">

    <link rel="stylesheet" href="./style_clean.css">
    <script src="./Script.js" defer></script>
</head>

<body>

    <main class="app">

        <header class="header">
            <h1 id="title" data-i18n="title">My To-Do List</h1>

            <select id="languageSelect" aria-label="Select language">
                <option value="en">English</option>
                <option value="ar">العربية</option>
            </select>
        </header>

        <section class="input-container">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
                autocomplete="off"
                maxlength="200"
            >

            <button type="button" id="addBtn" data-i18n="add">
                Add Task
            </button>
        </section>

        <p id="message" role="status" aria-live="polite"></p>

        <section class="search-container">
            <input
                type="search"
                id="searchInput"
                placeholder="Search tasks..."
                autocomplete="off"
            >
        </section>

        <section class="stats" id="stats" aria-live="polite"></section>

        <section class="progress-container">
            <div class="progress-info">
                <span data-i18n="progress">Progress</span>
                <span id="progressPercentage">0%</span>
            </div>

            <div
                class="progress-track"
                role="progressbar"
                id="progressBar"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
            >
                <div id="progressFill"></div>
            </div>
        </section>

        <section class="controls">

            <div class="filter-group">
                <button type="button" data-filter="all" class="active"
                    data-i18n="all">All</button>

                <button type="button" data-filter="incomplete"
                    data-i18n="active">Active</button>

                <button type="button" data-filter="completed"
                    data-i18n="completed">Completed</button>
            </div>

            <button type="button" id="deleteCompletedBtn"
                data-i18n="deleteCompleted">
                Delete Completed
            </button>

            <button type="button" id="clearBtn" data-i18n="clearAll">
                Clear All
            </button>

        </section>

        <p class="task-counter">
            <span data-i18n="totalTasks">Total tasks:</span>
            <span id="taskCount">0</span>
        </p>

        <ul id="taskList" aria-label="Task list"></ul>

        <p id="emptyState" data-i18n="empty">
            No tasks yet. Add your first task!
        </p>

        <footer class="footer">
            <p>AURIX15 To-Do List</p>
        </footer>

    </main>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js")
                    .catch(error => {
                        console.error("Service Worker registration failed:", error);
                    });
            });
        }
    </script>

</body>
</html>
